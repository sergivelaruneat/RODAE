version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: rodae-mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rodae}
      MYSQL_USER: ${DB_USERNAME:-rodae}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"   # opcional exponer
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_ROOT_PASSWORD:-rootsecret} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rodae-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Conecta Laravel a MySQL del compose
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306

      # Overrides php.ini (puedes cambiarlos aquí o en .env)
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-128M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-128M}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}

      # Controla si migrar en cada arranque
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    volumes:
      - ./:/var/www/html:delegated
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage

  web:
    image: nginx:alpine
    container_name: rodae-web
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  vendor:
  storage:
